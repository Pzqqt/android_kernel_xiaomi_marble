name: Build Marble Kernel with LLVM 19

on:
  push:
    branches: [ melt-3.7-2025/04-04 ]
  pull_request:
    branches: [ melt-3.7-2025/04-04 ]

env:
  KERNEL_VERSION: "5.10"
  ANDROID_VERSION: "12"
  ARCH: arm64
  LLVM_VERSION: 19.1.7
  DEVICE_CODENAME: marble
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        repository: Guxin12/android_kernel_xiaomi_marble
        ref: melt-3.7-2025/04-04
        submodules: recursive
        path: kernel

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential flex bison libssl-dev libelf-dev \
          bc python3 git device-tree-compiler ncurses-dev \
          lz4 zip unzip ccache xz-utils

    - name: Cache setup
      uses: actions/cache@v3
      with:
        path: |
          ${{ env.CCACHE_DIR }}
          toolchains
        key: ${{ runner.os }}-llvm-${{ env.LLVM_VERSION }}-${{ hashFiles('kernel/Makefile') }}

    - name: Setup LLVM toolchain
      run: |
        mkdir -p toolchains
        LLVM_URL="https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/clang+llvm-$LLVM_VERSION-x86_64-linux-gnu-ubuntu-22.04.tar.xz"
        
        echo "⬇️ 下载 LLVM $LLVM_VERSION..."
        if ! wget -q --tries=3 --show-progress -O llvm.tar.xz "$LLVM_URL"; then
          echo "❌ 下载失败，请检查版本号或网络连接"
          exit 1
        fi

        echo "🔍 验证压缩包..."
        if ! tar -tf llvm.tar.xz >/dev/null; then
          echo "❌ 压缩包损坏！"
          exit 1
        fi

        echo "📦 解压文件..."
        tar -xJf llvm.tar.xz -C toolchains/
        mv toolchains/clang+llvm-$LLVM_VERSION-x86_64-linux-gnu-ubuntu-22.04 toolchains/llvm
        rm llvm.tar.xz

        echo "✅ LLVM 安装完成"
        ls -la toolchains/llvm/bin/clang

    - name: Setup environment
      run: |
        echo "CLANG_PATH=$(pwd)/toolchains/llvm/bin" >> $GITHUB_ENV
        echo "PATH=$(pwd)/toolchains/llvm/bin:$PATH" >> $GITHUB_ENV
        echo "KBUILD_BUILD_VERSION=$(date +%Y%m%d-%H%M)" >> $GITHUB_ENV

    - name: Build kernel
      working-directory: ./kernel
      run: |
        # 清理构建目录
        make O=out clean

        # 生成配置
        make O=out ARCH=$ARCH CC=clang \
          LD=ld.lld \
          AR=llvm-ar \
          NM=llvm-nm \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump \
          STRIP=llvm-strip \
          LLVM=1 \
          LLVM_IAS=1 \
          vendor/gki_defconfig

        # 开始编译
        time make O=out ARCH=$ARCH CC=clang \
          LD=ld.lld \
          AR=llvm-ar \
          NM=llvm-nm \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump \
          STRIP=llvm-strip \
          LLVM=1 \
          LLVM_IAS=1 \
          -j$(($(nproc) + 2)) \
          CCACHE_CPP2=yes

    - name: Package with AnyKernel3
      run: |
        git clone https://github.com/osm0sis/AnyKernel3.git
        cp kernel/out/arch/arm64/boot/{Image.lz4,dtbo.img,dtb.img} AnyKernel3/
        
        # 修改 AnyKernel 配置
        sed -i "s|device.name1=.*|device.name1=$DEVICE_CODENAME|" AnyKernel3/anykernel.sh
        sed -i "s|kernel.string=.*|kernel.string=LLVM-$LLVM_VERSION-${{ env.KBUILD_BUILD_VERSION }}|" AnyKernel3/anykernel.sh
        
        # 打包
        cd AnyKernel3
        zip -r9 $DEVICE_CODENAME-llvm$LLVM_VERSION-${{ env.KBUILD_BUILD_VERSION }}.zip * -x .git*

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.DEVICE_CODENAME }}-kernel
        path: AnyKernel3/*.zip
        retention-days: 7
