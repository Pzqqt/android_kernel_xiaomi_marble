name: Build Marble Kernel with Proton Clang

on:
  push:
    branches: [ melt-3.7-2025/04-04 ]
  pull_request:
    branches: [ melt-3.7-2025/04-04 ]

env:
  KERNEL_VERSION: "5.10"
  ANDROID_VERSION: "12"
  ARCH: arm64
  DEVICE_CODENAME: marble
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CLANG_DIR: toolchains/proton-clang

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        repository: Guxin12/android_kernel_xiaomi_marble
        ref: melt-3.7-2025/04-04
        submodules: recursive
        path: kernel

    - name: Checkout Proton Clang
      uses: actions/checkout@v4
      with:
        repository: Guxin12/proton-clang
        path: ${{ env.CLANG_DIR }}
        # 如果使用特定分支/标签可以添加：
        # ref: master  # 或指定 tag/branch

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential flex bison libssl-dev libelf-dev \
          bc python3 git device-tree-compiler ncurses-dev \
          lz4 zip unzip ccache libncurses5

    - name: Setup environment
      run: |
        echo "CLANG_PATH=${{ github.workspace }}/${{ env.CLANG_DIR }}/bin" >> $GITHUB_ENV
        echo "PATH=$CLANG_PATH:$PATH" >> $GITHUB_ENV
        echo "KBUILD_BUILD_VERSION=$(date +%Y%m%d-%H%M)" >> $GITHUB_ENV
        
        # 验证 Clang 可用性
        ${{ env.CLANG_DIR }}/bin/clang --version

    - name: Build kernel
      working-directory: ./kernel
      run: |
        make O=out clean
        
        # 生成配置
        make O=out ARCH=$ARCH CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          LD=ld.lld \
          AR=llvm-ar \
          NM=llvm-nm \
          OBJCOPY=llvm-objcopy \
          STRIP=llvm-strip \
          LLVM=1 \
          vendor/gki_defconfig

        # 开始编译
        time make O=out ARCH=$ARCH CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          LD=ld.lld \
          AR=llvm-ar \
          NM=llvm-nm \
          OBJCOPY=llvm-objcopy \
          STRIP=llvm-strip \
          LLVM=1 \
          LLVM_IAS=1 \
          -j$(($(nproc) + 2)) \
          CCACHE_CPP2=yes

    - name: Package with AnyKernel3
      run: |
        git clone https://github.com/osm0sis/AnyKernel3.git
        cp kernel/out/arch/arm64/boot/{Image.lz4,dtbo.img,dtb.img} AnyKernel3/
        
        # 修改 AnyKernel 信息
        sed -i "s|device.name1=.*|device.name1=$DEVICE_CODENAME|" AnyKernel3/anykernel.sh
        sed -i "s|kernel.string=.*|kernel.string=Proton-Clang-${{ env.KBUILD_BUILD_VERSION }}|" AnyKernel3/anykernel.sh
        
        # 打包
        cd AnyKernel3
        zip -r9 $DEVICE_CODENAME-proton-${{ env.KBUILD_BUILD_VERSION }}.zip * -x .git*

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.DEVICE_CODENAME }}-kernel
        path: AnyKernel3/*.zip
        retention-days: 7
