name: Build Kernel
on:
  workflow_dispatch:

jobs:
  Build-Kernel:
    strategy:
      fail-fast: true
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Build Kernel
      uses: dabao1955/kernel_build_action@main
      with:
          kernel-url: https://github.com/yihao0628/android_kernel_xiaomi_marble
          kernel-dir: melt-a12-5-10
          kernel-branch: melt-rebase
          config: marble_defconfig
          arch: arm64
          aosp-gcc: true
          aosp-clang: true
          ksu: true
          ksu-version: main
          android-version: 12
          aosp-clang-version: r416183b
          disable-lto: false        # 关闭 LTO 禁用
          build-args: LTO=thin KCFLAGS="-Wno-frame-larger-than="
          anykernel3: true
