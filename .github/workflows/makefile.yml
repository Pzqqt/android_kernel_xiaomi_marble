    # 构建内核
    - name: Build Kernel
      uses: dabao1955/kernel_build_action@main
      with:
          kernel-url: https://github.com/yihao0628/android_kernel_xiaomi_marble
          kernel-dir: melt-a12-5-10  # 使用已存在的目录
          config: marble_defconfig
          arch: arm64
          aosp-gcc: true
          aosp-clang: true
          ksu: true
          android-version: 12
          aosp-clang-version: r416183b
          anykernel3: true