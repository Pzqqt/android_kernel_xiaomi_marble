name: Build Kernel
on:
  workflow_dispatch:

jobs:
  Build-Kernel:
    strategy:
      fail-fast: true
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Check Makefile Syntax
      run: |
        # 调试：显示工作区目录结构
        echo "Workspace contents:"
        ls -al $GITHUB_WORKSPACE
        
        # 进入内核源码目录
        cd $GITHUB_WORKSPACE/melt-a12-5-10
        
        # 调试：显示内核源码目录内容
        echo "Kernel source contents:"
        ls -al
        
        # 检查 Makefile 语法
        grep -E '^[A-Za-z0-9_]+[[:space:]]*=[[:space:]]*$' Makefile
        grep "KBUILD_CFLAGS" Makefile
        make -n O=out ARCH=arm64 help
      shell: bash
    - name: Build Kernel
      uses: dabao1955/kernel_build_action@main
      with:
          kernel-url: https://github.com/yihao0628/android_kernel_xiaomi_marble
          kernel-dir: melt-a12-5-10
          kernel-branch: melt-rebase
          config: marble_defconfig
          arch: arm64
          aosp-gcc: true
          aosp-clang: true
          ksu: true
          ksu-version: main
          android-version: 12
          aosp-clang-version: r416183b
          disable-lto: true
          anykernel3: true
          extra-cmd: |
            # 确保替换操作不会破坏变量语法
            sed -i 's/^KBUILD_CFLAGS +=/KBUILD_CFLAGS += -Wframe-larger-than=18000/' $GITHUB_WORKSPACE/melt-a12-5-10/Makefile
